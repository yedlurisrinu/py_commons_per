[build-system]
requires = ["setuptools>=68,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py_commons_per"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "hvac>=2.1.0,<3.0.0",
    "pytest>=9.0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["py_commons_per*"]
